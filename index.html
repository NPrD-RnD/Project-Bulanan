function showArchive(p){if(!p.archivedTasks?.length)return;const box=document.createElement('details');box.className='panel archive-list';box.innerHTML=`<summary>Arsip pekerjaan (${p.archivedTasks.length})</summary><p class="muted">Tidak dihitung pada status project. Pekerjaan yang sama akan dipulihkan jika jenis project dikembalikan.</p>`+p.archivedTasks.map(t=>`<div class="archive-item"><b>${esc(t.title)}</b> ${badge(taskStatus(t))}<p class="muted">Mulai ${date(t.start)} · Deadline ${date(t.deadline)}</p>${(t.points||[]).map(u=>`<div class="preserve"><p>${badge(u.status)} ${esc(u.text)}<br><span class="muted">Last update ${date(u.date)}</span></p>${notesReport(u)}<div class="gallery">${(u.images||[]).map(im=>`<img src="${esc(im.data)}" alt="${esc(im.name)}" data-view-image="${esc(im.data)}">`).join('')}</div></div>`).join('')}</div>`).join('');$('detail').append(box)}

function notesReport(u){return (u.notes||[]).map(n=>`<p class="preserve"><b>Note · ${date(n.date)}</b><br>${esc(n.text)}</p>`).join('')}
function notePanel(t,u){return `<div class="notes-panel"><b>Notes (${u.notes?.length||0})</b>${(u.notes||[]).map(n=>`<details class="note-item"><summary><p>${esc(n.text)}</p><span class="muted">${date(n.date)} · Ketuk untuk edit</span></summary><form class="note-form" data-note-task="${esc(t.id)}" data-note-point="${esc(u.id)}" data-edit-note="${esc(n.id)}"><label>Edit note<textarea name="text" required maxlength="20000">${esc(n.text)}</textarea></label><div class="row"><button>Simpan note</button><button type="button" class="danger" data-remove-note="${esc(n.id)}" data-note-task="${esc(t.id)}" data-note-point="${esc(u.id)}">Hapus note</button></div></form></details>`).join('')}<details class="add-task-box"><summary class="add-task-toggle">＋ Note baru</summary><form class="note-form" data-note-task="${esc(t.id)}" data-note-point="${esc(u.id)}"><label>Note baru<textarea name="text" required maxlength="20000" placeholder="Misalnya: revisi formula sudah dikirim, menunggu feedback…"></textarea></label><p class="muted">Tanggal note dan Last update dicatat otomatis saat disimpan.</p><div class="row"><button>Simpan note</button><button type="button" class="secondary" data-cancel-note>Batal</button></div></form></details></div>`}
function bindNotes(){for(const point of $('detail').querySelectorAll('[data-open-point]'))point.addEventListener('toggle',()=>{if(point.open)openedPoints.add(point.dataset.openPoint);else openedPoints.delete(point.dataset.openPoint)});for(const f of $('detail').querySelectorAll('.note-form')){f.onsubmit=e=>{e.preventDefault();const text=new FormData(f).get('text').trim();if(!text)return;openedTasks.add(f.dataset.noteTask);openedPoints.add(f.dataset.notePoint);mutate(a=>{const u=a.find(p=>p.id===selected).tasks.find(t=>t.id===f.dataset.noteTask).points.find(u=>u.id===f.dataset.notePoint);u.notes=u.notes||[];if(f.dataset.editNote){const n=u.notes.find(n=>n.id===f.dataset.editNote);n.text=text;n.date=today()}else u.notes.push({id:uid(),text,date:today()});u.date=today()});showSaved('Note disimpan.')};const cancel=f.querySelector('[data-cancel-note]');if(cancel)cancel.onclick=()=>{f.reset();f.parentElement.open=false}}for(const b of $('detail').querySelectorAll('[data-remove-note]'))b.onclick=e=>{e.stopPropagation();if(!confirm('Hapus note ini?'))return;openedTasks.add(b.dataset.noteTask);openedPoints.add(b.dataset.notePoint);mutate(a=>{const u=a.find(p=>p.id===selected).tasks.find(t=>t.id===b.dataset.noteTask).points.find(u=>u.id===b.dataset.notePoint);u.notes=u.notes.filter(n=>n.id!==b.dataset.removeNote);u.date=today()});showSaved('Note dihapus.')};}

function imagePanel(t,u){return `<div class="image-panel"><b>Lampiran gambar (${u.images?.length||0})</b><div class="gallery">${(u.images||[]).map(im=>`<figure><img src="${esc(im.data)}" alt="${esc(im.name)}" data-view-image="${esc(im.data)}"><figcaption>${esc(im.name)}</figcaption><button type="button" class="danger" data-remove-image="${esc(im.id)}" data-image-task="${esc(t.id)}" data-image-point="${esc(u.id)}">Hapus gambar</button></figure>`).join('')}</div><label class="button secondary">＋ Tambah gambar<input type="file" accept="image/jpeg,image/png,image/webp" multiple data-add-images="${esc(u.id)}" data-image-task="${esc(t.id)}" style="display:none"></label><p class="muted">JPEG, PNG, atau WebP. Ketuk gambar untuk memperbesar. Gambar diperkecil untuk menghemat ruang; simpan file asli jika memerlukan resolusi penuh.</p></div>`}
async function compressImage(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Gunakan gambar JPEG, PNG, atau WebP.');if(file.size>25*1024*1024)throw Error('Gambar maksimal 25 MB per file.');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Gambar tidak dapat dibaca: '+file.name));img.src=url});if(img.width*img.height>65000000)throw Error('Resolusi gambar terlalu besar.');const scale=Math.min(1,2200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let result=canvas.toDataURL('image/jpeg',.88);if(result.length>1400000)result=canvas.toDataURL('image/jpeg',.72);return {id:uid(),name:file.name.slice(0,200),data:result}}finally{URL.revokeObjectURL(url)}}
async function readImages(files){if(files.length>10)throw Error('Pilih maksimal 10 gambar sekali tambah.');const images=[];for(const f of files)images.push(await compressImage(f));return images}
function bindImageControls(){for(const input of $('detail').querySelectorAll('[data-add-images]'))input.onchange=async()=>{if(!input.files.length)return;input.disabled=true;try{const projectId=selected,taskId=input.dataset.imageTask,pointId=input.dataset.addImages,images=await readImages(input.files);openedTasks.add(taskId);mutate(a=>{const u=a.find(p=>p.id===projectId).tasks.find(t=>t.id===taskId).points.find(u=>u.id===pointId);u.images=[...(u.images||[]),...images];u.date=today()});showSaved('Gambar ditambahkan.')}catch(e){alert(e.message);input.disabled=false;input.value=''}};for(const b of $('detail').querySelectorAll('[data-remove-image]'))b.onclick=e=>{e.stopPropagation();if(!confirm('Hapus gambar ini?'))return;mutate(a=>{const u=a.find(p=>p.id===selected).tasks.find(t=>t.id===b.dataset.imageTask).points.find(u=>u.id===b.dataset.imagePoint);u.images=u.images.filter(im=>im.id!==b.dataset.removeImage);u.date=today()});showSaved('Gambar dihapus.')};}
const viewer=document.createElement('dialog');viewer.className='image-view';viewer.innerHTML='<button type="button" class="secondary">Tutup</button><p class="muted"></p><img alt="Lampiran diperbesar">';document.body.append(viewer);viewer.querySelector('button').onclick=()=>viewer.close();$('detail').addEventListener('click',e=>{const im=e.target.closest('[data-view-image]');if(!im)return;viewer.querySelector('img').src=im.dataset.viewImage;viewer.querySelector('p').textContent=im.alt||'Lampiran gambar';viewer.showModal()});
const previousValidation=valid;valid=function(a){previousValidation(a);for(const p of a){if(p.type!==undefined&&p.type!==''&&(!Object.hasOwn(TEMPLATES,p.type)))throw Error('Jenis project tidak valid');if(p.archivedTasks!==undefined){if(!Array.isArray(p.archivedTasks))throw Error('Arsip tidak valid');previousValidation([{...p,id:'archive-validation',tasks:p.archivedTasks,updates:[]}])}for(const t of [...p.tasks,...(p.archivedTasks||[])]){if(t.templateKey!==undefined&&(typeof t.templateKey!=='string'||t.templateKey.length>500))throw Error('Identitas template tidak valid')}for(const t of [...p.tasks,...(p.archivedTasks||[])])for(const u of t.points||[]){if(u.notes!==undefined){if(!Array.isArray(u.notes)||u.notes.length>10000)throw Error('Note tidak valid');const ids=new Set();for(const n of u.notes){if(!n||typeof n.id!=='string'||!n.id||n.id.length>100||ids.has(n.id)||typeof n.text!=='string'||!n.text.trim()||n.text.length>20000||typeof n.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(n.date))throw Error('Data note tidak valid');ids.add(n.id)}}if(u.images!==undefined){if(!Array.isArray(u.images)||u.images.length>500)throw Error('Lampiran tidak valid');const ids=new Set();for(const im of u.images){if(!im||typeof im.id!=='string'||!im.id||ids.has(im.id)||typeof im.name!=='string'||im.name.length>200||typeof im.data!=='string'||im.data.length>5000000||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(im.data))throw Error('Data gambar tidak valid');ids.add(im.id)}}}}return a};
$('projectType').onchange=()=>{$('templateHint').textContent=TEMPLATES[$('projectType').value]?`${TEMPLATES[$('projectType').value].length} pekerjaan otomatis. Pekerjaan yang sama mempertahankan data; sisanya diarsipkan. Status project otomatis.`:'Pekerjaan ditambahkan manual. Status project otomatis.'};
// IndexedDB stores images and notes together; legacy localStorage is imported once.
let db=null,saveQueue=Promise.resolve(),storageReady=false;const localPersist=persist;
function dbWrite(snapshot){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(snapshot,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('Penyimpanan gagal'));tx.onabort=()=>reject(tx.error||Error('Penyimpanan dibatalkan'))})}
persist=function(next){normalizePoints(next);data=next;render();notice('Menyimpan di perangkat…');const snapshot=JSON.stringify(next);saveQueue=saveQueue.catch(()=>{}).then(async()=>{try{if(db)await dbWrite(snapshot);else localStorage.setItem(KEY,snapshot);notice('Tersimpan di perangkat · '+new Date().toLocaleTimeString('id-ID'))}catch(e){notice('Belum tersimpan permanen: penyimpanan tidak tersedia atau penuh. Unduh cadangan sekarang.');showSaved('Belum tersimpan permanen. Unduh cadangan.');alert('Perubahan belum tersimpan permanen. Unduh cadangan untuk menyimpan data dan gambar sebelum menutup halaman.')}})};
async function initStorage(){const main=document.querySelector('main');main.inert=true;try{db=await new Promise((resolve,reject)=>{const request=indexedDB.open('ProjectBulananOffline',1);request.onupgradeneeded=()=>request.result.createObjectStore('data');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('Penyimpanan sedang digunakan'))});const stored=await new Promise((resolve,reject)=>{const tx=db.transaction('data','readonly'),req=tx.objectStore('data').get(KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(stored!==undefined){data=valid(JSON.parse(stored));normalizePoints(data);selected=data[0]?.id||''}else if(data.length){await dbWrite(JSON.stringify(normalizePoints(data)))}notice('Penyimpanan perangkat siap. Gambar dan catatan ikut dalam cadangan.')}catch(e){if(db){db.close();db=null}notice('Menggunakan penyimpanan browser terbatas. Jika penuh, unduh cadangan.')}finally{storageReady=true;main.inert=false;render()}}

function selectFirstVisible(){const q=$('search').value.toLowerCase(),f=$('filter').value;selected=data.find(p=>(!selectedType||p.type===selectedType)&&(!f||p.status===f)&&[p.name,p.code,p.goal].join(' ').toLowerCase().includes(q))?.id||'';openedTasks.clear()}
function renderTypeNavigation(){const kinds=Object.keys(TEMPLATES);$('metrics').innerHTML=kinds.map(type=>`<button type="button" class="metric type-card ${selectedType===type?'active':''}" data-project-type="${esc(type)}" aria-pressed="${selectedType===type}"><b>${data.filter(p=>p.type===type).length}</b>${esc(type)}<span>project · klik untuk melihat status</span></button>`).join('');$('typeStatusPanel').innerHTML=selectedType?`<div class="type-status-panel"><div class="row"><b style="flex:1">${esc(selectedType)} · ${data.filter(p=>p.type===selectedType).length} project</b><button type="button" class="secondary" id="allTypes">Semua project</button></div><div class="status-counts">${[['ongoing','Ongoing'],['notyet','Not Yet'],['done','Done']].map(([status,name])=>`<button type="button" class="${status} ${$('filter').value===status?'active':''}" data-type-status="${status}">${name} · ${data.filter(p=>p.type===selectedType&&p.status===status).length}</button>`).join('')}<button type="button" class="secondary" data-type-status="">Semua status</button></div><p class="muted">Klik status untuk melihat project di daftar bawah. Pencarian tetap berlaku.</p></div>`:'';}
$('metrics').onclick=e=>{const b=e.target.closest('[data-project-type]');if(!b)return;selectedType=b.dataset.projectType;$('filter').value='';selectFirstVisible();render()};$('typeStatusPanel').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='allTypes'){selectedType='';$('filter').value=''}else if(b.hasAttribute('data-type-status'))$('filter').value=b.dataset.typeStatus;selectFirstVisible();render()};

try{valid(data)}catch(e){notice('Data lama tidak valid. Pulihkan cadangan yang sesuai.');data=[];selected=''}
initStorage();

render();

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'filter_projects',description:'Show local projects by project type and status.',inputSchema:{type:'object',properties:{type:{type:'string',enum:['','NID','PIPELINE','PUSH BUTTON','NPL']},status:{type:'string',enum:['','notyet','ongoing','done']}},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input!=='object'||!['','NID','PIPELINE','PUSH BUTTON','NPL'].includes(input.type??'')||!['','notyet','ongoing','done'].includes(input.status??''))throw Error('Invalid filter');selectedType=input.type??'';$('filter').value=input.status??'';selectFirstVisible();render();return {type:selectedType,status:$('filter').value};}})).catch(()=>{});}catch{}}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',async()=>{try{const registration=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const worker=registration.active;worker?.postMessage({type:'CACHE_APP'});}catch{notice('Mode offline belum tersedia. Buka kembali saat terhubung internet.');}});}

</script></body></html>
